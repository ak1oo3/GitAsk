services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gitask
      POSTGRES_PASSWORD: gitask
      POSTGRES_DB: gitask
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitask -d gitask"]
      interval: 5s
      timeout: 5s
      retries: 10
